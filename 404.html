<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Grab the pathname, query parameters, and hash (e.g., "/pricing?plan=pro#top")
        const path = window.location.pathname + window.location.search + window.location.hash;
        
        // Redirect to the new app while preserving the exact path parameters
        window.location.replace("https://pdfboss.app" + path);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
